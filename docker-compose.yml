services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Host=postgres;Port=5432;Database=pricenego;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-price-negotiation-app}
      Jwt__Audience: ${JWT_AUDIENCE:-price-negotiation-api}
      Jwt__PrivateKey: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY (ES256 PKCS#8 PEM, see README)}
      Jwt__ExpiryMinutes: "60"
      Seeding__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@app.com}
      Seeding__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      Seeding__StaffEmail: ${SEED_STAFF_EMAIL:-staff@app.com}
      Seeding__StaffPassword: ${SEED_STAFF_PASSWORD:?set SEED_STAFF_PASSWORD}
      Seeding__SeedSampleProducts: "true"
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pricenego
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
